services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panelshelf
    ports:
      - "8080:8000"
    environment:
      APP_NAME: ${APP_NAME:-PanelShelf}
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-exposing}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      LIBRARY_ROOT: ${LIBRARY_ROOT:-/data/library}
      CACHE_ROOT: ${CACHE_ROOT:-/data/cache}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      THUMBNAIL_WIDTH: ${THUMBNAIL_WIDTH:-400}
      THUMBNAIL_HEIGHT: ${THUMBNAIL_HEIGHT:-600}
      PAGE_CACHE_MAX_DIMENSION: ${PAGE_CACHE_MAX_DIMENSION:-2400}
    volumes:
      - ./data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panelshelf}
      POSTGRES_USER: ${POSTGRES_USER:-panelshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelshelf}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
